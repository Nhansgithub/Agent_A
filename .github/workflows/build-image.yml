# Build the Docker image OFF the 1 GB box and push it (AD-21, Story 6.4).
#
# The Droplet only PULLS this image — building on 1 GB can OOM. This workflow is the "off-box build"
# the architecture mandates. Configure the registry secrets, then it runs on a tag or manually.

name: build-image

on:
  push:
    # `master` keeps :latest current, so a routine change needs no tag ceremony. Tags still build
    # and additionally publish an immutable `:vX.Y.Z` you can roll back to.
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A Docker repository name must be lowercase, but `github.repository` preserves the owner/repo
      # casing as typed on GitHub (e.g. Nhansgithub/Agent_A) — using it raw fails the build with
      # "repository name must be lowercase".
      - name: Lowercase the image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # Second, immutable tag. A release tag keeps its own name; a branch build is identified by
          # commit, because tagging every master build ":master" would give you a moving label with
          # nothing to roll back to.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
